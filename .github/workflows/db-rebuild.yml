# ═══════════════════════════════════════════════════════════════
# فحص إعادة بناء قاعدة البيانات من ملفات supabase/migrations
#
# يبني قاعدة Postgres نظيفة ومؤقتة داخل GitHub (supabase start) ويطبّق كل
# الـ migrations بالترتيب. إذا فشل أي ملف، يفشل الفحص.
#
# أمان: لا يستخدم أي أسرار (secrets) ولا يتصل بقاعدة الإنتاج إطلاقاً —
# كل شيء يجري على قاعدة محلية تُحذف عند انتهاء التشغيل.
# ═══════════════════════════════════════════════════════════════
name: DB Rebuild Check

on:
  push:
    branches:
      - db-baseline
    paths:
      - 'supabase/**'
      - '.github/workflows/db-rebuild.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/db-rebuild.yml'
  workflow_dispatch:

jobs:
  rebuild:
    name: Rebuild DB from migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies all migrations)
        # نستبعد الخدمات غير اللازمة لتسريع التشغيل. auth و storage و postgrest و realtime
        # تبقى لأن الـ migrations تعتمد على مخططاتها (auth.users, storage.objects ...).
        run: |
          set +e
          supabase start -x studio,mailpit,edge-runtime,logflare,vector,imgproxy,postgres-meta,supavisor 2>&1 | tee start.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # نُظهر آخر سطور الخطأ كـ annotation كي يسهل قراءتها دون فتح السجل الكامل
            msg=$(tail -n 60 start.log | sed 's/\r//g; s/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=supabase start failed::${msg}"
          fi
          exit "$code"

      - name: Schema summary
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          select 'tables'    as what, count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'
          union all select 'functions', count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'
          union all select 'policies',  count(*) from pg_policies where schemaname='public'
          union all select 'triggers',  count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal
          union all select 'indexes',   count(*) from pg_indexes where schemaname='public'
          union all select 'migrations_applied', count(*) from supabase_migrations.schema_migrations;
          SQL

      - name: Public tables without RLS (report)
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=1 -c "select c.relname as table_without_rls from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and not c.relrowsecurity order by 1;"

      - name: Schema fingerprint (compare with production)
        # يطبع بصمة لكل نوع كائن كـ annotation (fp)، وقوائم رموز قصيرة لكل كائن (tok-*) لتشخيص الفروق
        # عند مقارنتها بنفس الاستعلامات على الإنتاج. لا أسرار ولا اتصال خارجي.
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fp=$(psql "$DB" -v ON_ERROR_STOP=1 -At -F ' ' -f supabase/tests/schema_objects.sql \
            -c "select kind, count(*), md5(string_agg(k, E'\n' order by k)) from schema_objects group by kind order by kind")
          echo "$fp"
          echo "::notice title=fp::$(echo "$fp" | awk 'BEGIN{ORS="%0A"} {print}')"
          if [ "${DETAIL:-1}" = "1" ]; then
            psql "$DB" -v ON_ERROR_STOP=1 -At -F '|' -f supabase/tests/schema_objects.sql \
              -c "select kind, string_agg(left(md5(k),7), ' ' order by k) from schema_objects group by kind order by kind" |
            while IFS='|' read -r kind toks; do
              echo "::notice title=tok-${kind}::${toks}"
            done
          fi

      - name: Function definition tokens (drift diagnosis)
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fd=$(psql "$DB" -v ON_ERROR_STOP=1 -At -c "select string_agg(left(md5(p.proname||'('||pg_get_function_identity_arguments(p.oid)||')'||md5(pg_get_functiondef(p.oid))),7), ' ' order by p.proname, pg_get_function_identity_arguments(p.oid)) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.prokind in ('f','p')")
          echo "::notice title=tok-funcdef::${fd}"
          cols=$(psql "$DB" -v ON_ERROR_STOP=1 -At -c "select string_agg(table_name||'.'||column_name||':'||data_type||':'||is_nullable||':'||coalesce(column_default,''), E'\n' order by table_name, column_name) from information_schema.columns where table_schema='public' and table_name in ('subscriptions','suppliers')" | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=diag-cols::${cols}"

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
