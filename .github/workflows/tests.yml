# ═══════════════════════════════════════════════════════════════
# تشغيل اختبارات RusoomPay تلقائياً على خوادم GitHub — بلا حاجة لجهازك
#
# يعمل عند:
#   - كل رفع (push) لأي فرع
#   - يدوياً بالضغط على زر "Run workflow" من تبويب Actions
#
# النتائج تظهر في تبويب Actions — يفتح من متصفّح الهاتف بسهولة.
# ═══════════════════════════════════════════════════════════════
name: اختبارات RusoomPay

on:
  # مؤقتاً: يدوي فقط (زر "Run workflow" بتبويب Actions).
  # السبب: الاختبارات التكاملية تشتغل ضد قاعدة الإنتاج الحقيقية نفسها (لا توجد قاعدة اختبار منفصلة حالياً)،
  # وتشغيلها تلقائياً على كل رفع تسبّب بتراكم مئات المدارس والمستخدمين الوهميين بالإنتاج.
  # رجّع "push: branches: ['**']" فقط بعد ربط قاعدة Supabase منفصلة للاختبار (TEST_SUPABASE_URL/KEY).
  workflow_dispatch:

jobs:
  test:
    name: تشغيل مجموعة الاختبارات
    runs-on: ubuntu-latest
    timeout-minutes: 15     # حماية: لو تعلّق اختبار (مثل حارس التكرار 10 ثوانٍ)، لا يستمر للأبد

    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تثبيت الحزم
        run: npm install

      - name: تشغيل الاختبارات
        run: npm test
        env:
          # تُقرأ من GitHub Secrets — لا تظهر أبداً في السجلّات أو الكود
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: ملخّص النتيجة
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ كل الاختبارات نجحت"
          else
            echo "❌ فشل اختبار واحد أو أكثر — راجع السجلّ أعلاه لتفاصيل الخطأ"
          fi
